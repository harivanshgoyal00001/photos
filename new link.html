<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="experiment.css".css">
  <style>
    /* Custom Background */
   
      body {
      margin: 0;
      padding: 20px;
      font-family: sans-serif;
      background: #1a1a1a url('a10a4052.jpg') no-repeat center center fixed;
      background-size: cover;
      color: black;
    }
    /* Grid Layout */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    /* Individual Image Card */
    .thumb-card {
      margin: 0;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: transform 0.2s ease;
      text-align: center;
    }

    .thumb-card:hover {
      transform: scale(1.05);
    }

    .thumb-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      display: block;
    }

    /* Image Name Label */
    .thumb-card figcaption {
      padding: 8px 5px;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Large Overlay/Modal */
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .lightbox img {
      max-width: 85%;
      max-height: 80%;
      border-radius: 6px;
    }

    .lightbox-caption {
      margin-top: 12px;
      font-size: 18px;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 30px;
      color: white;
      font-size: 30px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="gallery" id="gallery"></div>

    <span class="close-btn">&times;</span>

  </div>

    const gallery = document.getElementById('gallery');
    const lightbox = document.getElementById('lightbox');
    const largeImage = document.getElementById('largeImage');
    const largeCaption = document.getElementById('largeCaption');

    // Populate thumbnails with names
    images.forEach(item => {
      const card = document.createElement('figure');
      card.classList.add('thumb-card');
      card.onclick = () => openImage(item.src, item.name);

      const img = document.createElement('img');
      img.src = item.src;
      img.alt = item.name;

      const caption = document.createElement('figcaption');
      caption.textContent = item.name;

      card.appendChild(img);
      card.appendChild(caption);
      gallery.appendChild(card);
    });

    function openImage(src, name) {
      largeImage.src = src;
      largeCaption.textContent = name;
      lightbox.style.display = 'flex';
    }

    function closeImage() {
      lightbox.style.display = 'none';
    }
