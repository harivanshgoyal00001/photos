    /* Grid Layout */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    /* Individual Image Card */
    .thumb-card {
      margin: 0;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: transform 0.2s ease;
      text-align: center;
    }

    .thumb-card:hover {
      transform: scale(1.05);
    }

    .thumb-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      display: block;
    }

    /* Image Name Label */
    .thumb-card figcaption {
      padding: 8px 5px;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Large Overlay/Modal */
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .lightbox img {
      max-width: 85%;
      max-height: 80%;
      border-radius: 6px;
    }

    .lightbox-caption {
      margin-top: 12px;
      font-size: 18px;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 30px;
      color: white;
      font-size: 30px;
      cursor: pointer;
    }
  </style>
</head>
<script src="new.js"></script>
<body>

  <div class="gallery" id="gallery"></div>

  <div class="lightbox" id="lightbox" onclick="closeImage()">
    <span class="close-btn">&times;</span>
    <img id="largeImage" src="" alt="Enlarged view">
    <div class="lightbox-caption" id="largeCaption"></div>
  </div>
  <script>
    const images = [
      {
  src: 'https://lh3.googleusercontent.com/d/1Mpf2GNsGdsuJebbC83lUb7FvKr6Ru1T9',
  name: 'DSC_8237.JPG'
},
{
  src: 'https://lh3.googleusercontent.com/d/1i6AH3_fIJS4rO7AFLl83MMkbjLYV9tbr',
  name: 'DSC_8238.JPG'
},
{
  src: 'https://lh3.googleusercontent.com/d/1xHzscYkKUFqBJWDHO3QF7i1sLTgtMZMv',
  name: 'DSC_8248.JPG'
},
{
  src: 'https://lh3.googleusercontent.com/d/1XJeOPP4Sz8XjFv1IPtM22CveQ8g_iwAT',
  name: 'DSC_8249.JPG'
},
{
  src: 'https://lh3.googleusercontent.com/d/1MeY42u-BTJ6tu7-YuBMsuV5iZckssxEq',
  name: 'DSC_8250.JPG'
},
{
  src: 'https://lh3.googleusercontent.com/d/1mTfnjXpd6Z4gxpYRqSLpAZbA_GLVquZT',
  name: 'DSC_8251.JPG'
},
{
  src: 'https://lh3.googleusercontent.com/d/1tLVcKxmvbw3k75yOTeI2rWMMAuvni4Sf',
  name: 'DSC_8252.JPG'
},
{
  src: 'https://lh3.googleusercontent.com/d/1XoVobCexSIYHqarx67dH0cipLyIii3RS',
  name: 'DSC_8253.JPG'
},
{
  src: 'https://lh3.googleusercontent.com/d/1XJHEx7ykNPys9w4lNiXe1i0PbqWpsarf',
  name: 'DSC_8254.JPG'
},
{
  src: 'https://lh3.googleusercontent.com/d/1OMOvBZbqDIu4wJ6cN3JKiy_ipbHsmh5a',
  name: 'DSC_8255.JPG'
},
{
  src: 'https://lh3.googleusercontent.com/d/1ehL356M-5uWM2HJNin3U0jRsX192d5tu',
  name: 'DSC_8256.JPG'
},
{
  src: 'https://lh3.googleusercontent.com/d/11WO_AiomoHR3iHOQbge6aKBTLhR6uO7Z',
  name: 'DSC_8368.JPG'
},
]
    ;

    const gallery = document.getElementById('gallery');
    const lightbox = document.getElementById('lightbox');
    const largeImage = document.getElementById('largeImage');
    const largeCaption = document.getElementById('largeCaption');

    // Populate thumbnails with names
    images.forEach(item => {
      const card = document.createElement('figure');
      card.classList.add('thumb-card');
      card.onclick = () => openImage(item.src, item.name);

      const img = document.createElement('img');
      img.src = item.src;
      img.alt = item.name;

      const caption = document.createElement('figcaption');
      caption.textContent = item.name;

      card.appendChild(img);
      card.appendChild(caption);
      gallery.appendChild(card);
    });

    function openImage(src, name) {
      largeImage.src = src;
      largeCaption.textContent = name;
      lightbox.style.display = 'flex';
    }

    function closeImage() {
      lightbox.style.display = 'none';
    }
  </script>
</body>
